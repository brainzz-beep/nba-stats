<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA Stats</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mu:#6b7280;--bd:#dcdfe4;--ac:#1d428a;--ok:#0a7d3b;--ko:#c8102e;--cd:#f5f6f8}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#eceef1;--mu:#9aa3af;--bd:#333943;--ac:#7ea6ff;--ok:#4cd07d;--ko:#ff7a8a;--cd:#1d2026}}
*{box-sizing:border-box}body{font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0 auto;padding:12px;max-width:1100px}
h1{font-size:20px;margin:4px 0 10px}h4{margin:10px 0 4px}
nav button,select{font:inherit;padding:6px 12px;border:1px solid var(--bd);background:var(--cd);color:var(--fg);border-radius:6px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600}
.mu,small{color:var(--mu)}.ok{color:var(--ok);font-weight:600}.ko{color:var(--ko);font-weight:600}.sm{font-size:13px;margin:2px 0}
input.l{width:56px;padding:2px 4px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--fg)}
ul{margin:4px 0;padding-left:18px}.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
</style></head><body>
<h1>🏀 NBA Stats</h1>
<nav><button data-t="g" class="on">Partite</button><button data-t="s">Squadra</button><button data-t="p">Giocatore</button></nav>
<div id="app">Caricamento…</div>
<p class="mu sm">Le proiezioni sono stime statistiche a scopo informativo, non consigli di puntata. I dati contro una singola avversaria si basano su pochi campioni (n). Scommetti solo su operatori con licenza ADM e con importi che puoi permetterti di perdere.</p>
<script>
const $=s=>document.querySelector(s);
const F={MIN:r=>r[7],PTS:r=>r[8],'2PM':r=>r[9]-r[11],'2PA':r=>r[10]-r[12],'3PM':r=>r[11],'3PA':r=>r[12],FTM:r=>r[13],FTA:r=>r[14],FGA:r=>r[10],REB:r=>r[15],AST:r=>r[16],STL:r=>r[17],BLK:r=>r[18]};
const M=[['PTS','Attacco (punti)',1,2],['OPP','Difesa (punti subiti)',-1,2],['REB','Rimbalzi',1,1.5],['AST','Assist',1,1.5],['STL','Rubate',1,.7],['BLK','Stoppate',1,.7],['TP','Tiro da 3 (%)',1,1.5]];
const mean=(a,f)=>a.length?a.reduce((s,x)=>s+f(x),0)/a.length:null;
const fx=(v,d=1)=>v==null?'–':v.toFixed(d);
const grp=p=>/C/.test(p||'')?'C':/F/.test(p||'')?'F':/G/.test(p||'')?'G':'';
let R=[],T={games:[],injuries:{}},byP={},byO={},P={},tg={},TS={},SA={},RK={},cut='';
const memo={};

(async()=>{
  const j=async u=>{try{const r=await fetch(u+'?'+Date.now());return r.ok?await r.json():null}catch(e){return null}};
  R=await j('data/games.json')||[];T=await j('data/today.json')||T;
  if(!R.length){$('#app').innerHTML='<p>Dati non ancora disponibili. Su GitHub apri Actions → "Aggiorna dati NBA" → Run workflow.</p>';return}
  init();show('g');
})();

function init(){
  R.sort((a,b)=>a[1]<b[1]?-1:a[1]>b[1]?1:0);
  for(const r of R){
    (byP[r[5]]??=[]).push(r);(byO[r[3]]??=[]).push(r);
    const t=tg[r[0]+'|'+r[2]]??={gid:r[0],team:r[2],opp:r[3],pts:0,reb:0,ast:0,stl:0,blk:0,tpm:0,tpa:0};
    t.pts+=r[8];t.reb+=r[15];t.ast+=r[16];t.stl+=r[17];t.blk+=r[18];t.tpm+=r[11];t.tpa+=r[12];
    const p=P[r[5]]??={team:'',pos:'',d:''};p.team=r[2];p.d=r[1];if(r[6])p.pos=r[6];
  }
  for(const t of Object.values(tg))(TS[t.team]??=[]).push(t);
  for(const t in TS){const g=TS[t].slice(-15),o=g.map(x=>tg[x.gid+'|'+x.opp]?.pts).filter(v=>v!=null);
    SA[t]={PTS:mean(g,x=>x.pts),OPP:o.length?o.reduce((a,b)=>a+b)/o.length:null,REB:mean(g,x=>x.reb),AST:mean(g,x=>x.ast),STL:mean(g,x=>x.stl),BLK:mean(g,x=>x.blk),
      TP:100*g.reduce((s,x)=>s+x.tpm,0)/Math.max(1,g.reduce((s,x)=>s+x.tpa,0))}}
  for(const[k,,d]of M){const l=Object.keys(SA).filter(t=>SA[t][k]!=null).sort((a,b)=>(SA[b][k]-SA[a][k])*d);l.forEach((t,i)=>(RK[t]??={})[k]=i+1)}
  const ld=new Date(R[R.length-1][1]+'T12:00:00Z');ld.setUTCDate(ld.getUTCDate()-14);cut=ld.toISOString().slice(0,10);
}

function strn(t){const r=RK[t];if(!r)return'';const f=[],w=[];
  for(const[k,l]of M){if(r[k]<=6)f.push(l+` (${r[k]}°)`);else if(r[k]>=25)w.push(l+` (${r[k]}°)`)}
  return`<span class=ok>Punti forti:</span> ${f.join(', ')||'nessuno spiccato'}<br><span class=ko>Punti deboli:</span> ${w.join(', ')||'nessuno marcato'}`}

function comp(a,b){const x=SA[a],y=SA[b],o=[];if(!x||!y)return o;
  for(const[k,l,d,th]of M){if(x[k]==null||y[k]==null)continue;const df=(x[k]-y[k])*d;
    if(Math.abs(df)>=th){const w=df>0?[a,b,x,y]:[b,a,y,x];o.push(`${w[0]} è più forte di ${w[1]} in ${l}: ${fx(w[2][k])} contro ${fx(w[3][k])}`)}}
  return o.slice(0,6)}

function pm(n,s){const k=n+s;return k in memo?memo[k]:memo[k]=mean((byP[n]||[]).slice(-30),F[s])}
function proj(n,s,opp){
  const rows=byP[n];if(!rows)return null;const f=F[s];
  const base=.5*mean(rows.slice(-10),f)+.5*mean(rows.slice(-30),f);
  const g=grp(P[n].pos);let sum=0,c=0;
  for(const r of byO[opp]||[]){if(r[7]<12||(g&&grp(r[6]||P[r[5]].pos)!==g))continue;const m=pm(r[5],s);if(m>=.8){sum+=f(r)/m;c++}}
  let fac=c?sum/c:1;fac=Math.min(1.25,Math.max(.8,1+(fac-1)*c/(c+30)));
  const vs=rows.filter(r=>r[3]===opp);
  return{p:base*fac,fac,n:c,vs:mean(vs,f),nv:vs.length}}

function cell(n,s,o){const r=proj(n,s,o);if(!r)return'<td>–</td>';
  return`<td><b>${fx(r.p)}</b> <small>${r.fac>=1?'+':''}${((r.fac-1)*100).toFixed(0)}% · n${r.n}${r.nv?` · vs ${fx(r.vs)} (${r.nv})`:''}</small><br><input class=l data-k="${n}|${s}|${o}" data-p="${r.p}" inputmode=decimal placeholder="linea"> <span></span></td>`}

function edge(i){const v=parseFloat(i.value.replace(',','.')),sp=i.nextElementSibling;
  if(!(v>0)){sp.textContent='';return}const p=+i.dataset.p,d=(p-v)/v;
  sp.innerHTML=Math.abs(d)<.06?'<span class=mu>nessun vantaggio</span>':d>0?`<span class=ok>OVER (+${(p-v).toFixed(1)})</span>`:`<span class=ko>UNDER (${(p-v).toFixed(1)})</span>`}

function side(t,o){
  const inj=T.injuries[t]||[],out=new Set(inj.filter(i=>/out/i.test(i.s)).map(i=>i.n));
  const pl=Object.keys(P).filter(n=>P[n].team===t&&!out.has(n)&&P[n].d>=cut).map(n=>[n,mean(byP[n].slice(-10),F.MIN)]).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return`<h4>${t}</h4><div class=sm>${strn(t)}</div>
  <div class=sm><b>Infortuni:</b> ${inj.map(i=>`${i.n} <small>(${i.s})</small>`).join(', ')||'nessuno segnalato'}</div>
  <div class=sc><table><tr><th>Giocatore (proiezione vs ${o})</th><th>PTS</th><th>REB</th><th>AST</th><th>3PM</th></tr>
  ${pl.map(([n])=>`<tr><td>${n} <small>${P[n].pos}</small></td>${['PTS','REB','AST','3PM'].map(s=>cell(n,s,o)).join('')}</tr>`).join('')}</table></div>`}

function pageG(){
  const gs=T.games.filter(g=>!g.done);
  if(!gs.length)return'<p>Nessuna partita in programma nei dati.</p>';
  return gs.map(g=>{const c=comp(g.away,g.home);
    return`<div class=card><h3>${g.away} @ ${g.home}</h3>
    <div class=sm>Linea: ${g.line||'n.d.'} · Over/Under: ${g.ou||'n.d.'} · ${new Date(g.date).toLocaleString('it-IT',{weekday:'short',hour:'2-digit',minute:'2-digit'})}</div>
    <ul>${c.map(x=>`<li>${x}</li>`).join('')||'<li class=mu>Squadre equilibrate nelle statistiche recenti.</li>'}</ul>
    ${side(g.away,g.home)}${side(g.home,g.away)}</div>`}).join('')}

const th=()=>'<th>G</th>'+Object.keys(F).map(k=>`<th>${k}</th>`).join('');
const tds=r=>`<td>${r.length}</td>`+Object.keys(F).map(k=>`<td>${fx(mean(r,F[k]))}</td>`).join('');
const sel=(id,l,v)=>`<select id=${id}>${l.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('')}</select>`;

function pageS(){
  const ts=Object.keys(TS).sort();return`<div class=row>Squadra ${sel('st',ts,ts[0])} Avversaria ${sel('so',['Tutte',...ts],'Tutte')}</div><div id=so_out></div>`}
function drawS(){
  const t=$('#st').value,o=$('#so').value;
  const pl=Object.keys(P).filter(n=>P[n].team===t&&P[n].d>=cut).sort((a,b)=>mean(byP[b].slice(-10),F.MIN)-mean(byP[a].slice(-10),F.MIN));
  const tab=f=>`<div class=sc><table><tr><th>Giocatore</th>${th()}</tr>${pl.map(n=>{const r=byP[n].filter(f);return r.length?`<tr><td>${n}</td>${tds(r)}</tr>`:''}).join('')}</table></div>`;
  $('#so_out').innerHTML=`<div class=card><div class=sm>${strn(t)}</div><div class=sm><b>Infortuni:</b> ${(T.injuries[t]||[]).map(i=>`${i.n} (${i.s})`).join(', ')||'nessuno segnalato'}</div></div>
   <h4>Media generale</h4>${tab(r=>r[2]===t)}${o==='Tutte'?'':`<h4>Media contro ${o}</h4>${tab(r=>r[2]===t&&r[3]===o)}`}`}

function pageP(){const ps=Object.keys(P).sort();return`<div class=row>Giocatore ${sel('pp',ps,ps[0])}</div><div id=pp_out></div>`}
function drawP(){
  const n=$('#pp').value,rows=byP[n],os=[...new Set(rows.map(r=>r[3]))].sort();
  $('#pp_out').innerHTML=`<div class=sc><table><tr><th>Avversaria</th>${th()}</tr><tr><td><b>Tutte</b></td>${tds(rows)}</tr>
  ${os.map(o=>`<tr><td>${o}</td>${tds(rows.filter(r=>r[3]===o))}</tr>`).join('')}</table></div>`}

function show(t){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#app').innerHTML=t==='g'?pageG():t==='s'?pageS():pageP();
  if(t==='s'){drawS();$('#st').onchange=$('#so').onchange=drawS}
  if(t==='p'){drawP();$('#pp').onchange=drawP}
  document.querySelectorAll('input.l').forEach(i=>{const v=localStorage.getItem('l|'+i.dataset.k);if(v){i.value=v;edge(i)}});
}
document.querySelector('nav').onclick=e=>{if(e.target.dataset.t)show(e.target.dataset.t)};
document.addEventListener('input',e=>{if(e.target.classList.contains('l')){try{localStorage.setItem('l|'+e.target.dataset.k,e.target.value)}catch(x){}edge(e.target)}});
</script></body></html>
